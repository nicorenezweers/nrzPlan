[package]
name = "nrzplan"
version = "1.0.0"
edition = "2024"
description = "nrzPlan – Boards, Todos, Kalender und Fokus an einem Ort (Dioxus + nrzUI)"
license = "MIT"

[[bin]]
name = "nrzplan"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["router", "fullstack"] }
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = { version = "0.1", features = ["debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }

# Server-only
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate"], optional = true }
dotenv = { version = "0.15", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["fs", "rt", "macros"], optional = true }
tracing = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
hmac = { version = "0.12", optional = true }

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
await_holding_lock = "deny"

[features]
default = []
server = ["dioxus/server", "dep:sqlx", "dep:dotenv", "dep:sha2", "dep:tokio", "dep:tracing", "dep:reqwest", "dep:hmac"]
web = ["dioxus/web"]
